name: AI Research Newsletter

on:
  # Manual run
  workflow_dispatch:

  # Every Sunday at 8:00 AM IST
  schedule:
    - cron: "30 2 * * 0"

jobs:
  generate-newsletter:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1-5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_EMAIL_PASSWORD: ${{ secrets.APP_EMAIL_PASSWORD }}

        run: python main.py